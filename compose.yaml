services:
  postgres:
    image: postgres:17-alpine
    container_name: api-productos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: api_productos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - api_productos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_productos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  api_productos_data:
